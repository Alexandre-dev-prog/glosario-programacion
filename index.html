<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glosario de Programación</title>

    <link rel="stylesheet" href="Styles.CSS">
</head>

<body>

    <header>

        <h1>Glosario de Programación</h1>

        <!-- Buscador -->
        <input type="search" id="buscador" placeholder="Buscar término...">

        <!-- Filtros -->
        <div id="filtros" class="filtros">

            <label>
                <input type="radio" name="filtro" value="Todos" checked>
                Todos
            </label>

            <label>
                <input type="radio" name="filtro" value="JavaScript">
                JavaScript
            </label>

            <label>
                <input type="radio" name="filtro" value="HTML">
                HTML
            </label>

            <label>
                <input type="radio" name="filtro" value="CSS">
                CSS
            </label>

        </div>

        <!-- Botón para agregar un nuevo término -->
        <button id="btn-nuevo">+ Nuevo término</button>

    </header>


    <main>

        <form id="formulario" hidden>
 <h2 id="titulo-formulario">Nuevo término</h2>
 <label>Término <input type="text" name="termino" required></label>
 <label>Categoría
 <select name="categoria">
 <option>JavaScript</option>
 <option>HTML</option>
 <option>CSS</option>
 </select>
 </label>
 <label>Definición <textarea name="definicion" required></textarea></label>
 <label>Ejemplo <textarea name="ejemplo"></textarea></label>
 <p id="error-formulario" class="error"></p>
 <button type="submit">Guardar</button>
 <button type="button" id="btn-cancelar">Cancelar</button>
</form>

        <!-- Lista de términos -->
        <section id="lista-terminos"></section>


        <!-- Mensaje cuando no hay resultados -->
        <p id="sin-resultados" hidden>
            No se encontró ese término
        </p>

    </main>


    <footer>

        <p id="contador">
            Mostrando 0 términos
        </p>

    </footer>


<template id="plantilla-tarjeta">
 <article class="tarjeta">
 <div class="tarjeta-titulo">
 <h2></h2>
 <span class="categoria"></span>
 </div>
 <p class="definicion"></p>
 <pre><code class="ejemplo"></code></pre>
 <div class="tarjeta-acciones">
 <button class="boton btn-editar">Editar</button>
 <button class="boton btn-eliminar">Eliminar</button>
 </div>
 </article>
</template>

<script src="app.js"></script>


</body>

</html>
